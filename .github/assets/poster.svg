  <text x="192" y="128" font-size="66" font-weight="700" fill="#e9e6df">Git Guide<tspan fill="#f05133">.</tspan></text>
  <text x="82" y="204" font-size="30" font-weight="600" fill="#e9e6df">Every Git and GitHub answer in one place.</text>
  <text x="82" y="248" font-size="24" fill="#e9e6df">an undo for everything<tspan fill="#9b968b">  ·  </tspan>works offline<tspan fill="#9b968b">  ·  </tspan>no trackers<tspan fill="#9b968b">  ·  </tspan>MIT</text>
  <rect x="80" y="300" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="80" y="318" width="5" height="74" fill="#f05133"/><text x="106" y="346" font-size="26" font-weight="700" fill="#f05133">Finder</text><text x="106" y="380" font-size="18" fill="#9b968b">Ask plain, or paste the error</text><rect x="510" y="300" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="510" y="318" width="5" height="74" fill="#f05133"/><text x="536" y="346" font-size="26" font-weight="700" fill="#f05133">Start</text><text x="536" y="380" font-size="18" fill="#9b968b">Zero to first push, six steps</text><rect x="940" y="300" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="940" y="318" width="5" height="74" fill="#f05133"/><text x="966" y="346" font-size="26" font-weight="700" fill="#f05133">Learn</text><text x="966" y="380" font-size="18" fill="#9b968b">What each command moves</text><rect x="80" y="428" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="80" y="446" width="5" height="74" fill="#f05133"/><text x="106" y="474" font-size="26" font-weight="700" fill="#f05133">Practise</text><text x="106" y="508" font-size="18" fill="#9b968b">Run Git on a graph, break nothing</text><rect x="510" y="428" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="510" y="446" width="5" height="74" fill="#f05133"/><text x="536" y="474" font-size="26" font-weight="700" fill="#f05133">Fix</text><text x="536" y="508" font-size="18" fill="#9b968b">Questions to the way out</text><rect x="940" y="428" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="940" y="446" width="5" height="74" fill="#f05133"/><text x="966" y="474" font-size="26" font-weight="700" fill="#f05133">Errors</text><text x="966" y="508" font-size="18" fill="#9b968b">Git&#x27;s messages, decoded</text><rect x="80" y="556" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="80" y="574" width="5" height="74" fill="#f05133"/><text x="106" y="602" font-size="26" font-weight="700" fill="#f05133">GitHub</text><text x="106" y="636" font-size="18" fill="#9b968b">First repo to protection</text><rect x="510" y="556" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="510" y="574" width="5" height="74" fill="#f05133"/><text x="536" y="602" font-size="26" font-weight="700" fill="#f05133">Workflows</text><text x="536" y="636" font-size="18" fill="#9b968b">Solo, fork, trunk, release</text><rect x="940" y="556" width="410" height="110" rx="12" fill="#1c1a18" stroke="#2e2c28" stroke-width="1.5"/><rect x="940" y="574" width="5" height="74" fill="#f05133"/><text x="966" y="602" font-size="26" font-weight="700" fill="#f05133">Cheatsheet</text><text x="966" y="636" font-size="18" fill="#9b968b">All commands, one line each</text>
  <rect x="80" y="692" width="98" height="36" rx="6" fill="none" stroke="#63b378" stroke-width="1.8"/><text x="129.0" y="716" font-size="18" font-weight="600" fill="#63b378" text-anchor="middle">SAFE</text><rect x="202" y="692" width="230" height="36" rx="6" fill="none" stroke="#d3a53a" stroke-width="1.8"/><text x="317.0" y="716" font-size="18" font-weight="600" fill="#d3a53a" text-anchor="middle">REWRITES HISTORY</text><rect x="456" y="692" width="175" height="36" rx="6" fill="none" stroke="#e5776b" stroke-width="1.8"/><text x="543.5" y="716" font-size="18" font-weight="600" fill="#e5776b" text-anchor="middle">DESTRUCTIVE</text>
  <text x="1320" y="716" font-size="18" fill="#9b968b" text-anchor="end">every answer carries its danger level and its undo</text>
