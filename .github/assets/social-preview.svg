  <text x="212" y="152" font-size="86" font-weight="700" fill="#e9e6df">Git Guide<tspan fill="#f05133">.</tspan></text>
  <text x="82" y="286" font-size="44" font-weight="600" fill="#e9e6df">Every Git and GitHub answer in one place.</text>
  <text x="82" y="348" font-size="30" fill="#9b968b">Type what you want to do, or paste the error Git printed.</text>
  <text x="82" y="392" font-size="30" fill="#9b968b">Exact commands, a danger level for each, and its undo.</text>
  <text x="82" y="472" font-size="28" fill="#e9e6df"><tspan fill="#f05133" font-weight="700">182</tspan> answers<tspan fill="#9b968b">   ·   </tspan><tspan fill="#f05133" font-weight="700">43</tspan> errors decoded<tspan fill="#9b968b">   ·   </tspan>an undo for everything<tspan fill="#9b968b">   ·   </tspan>works offline</text>
